# Quarkus Logging Configuration
quarkus.log.console.enabled=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.level=INFO

# File Logging in logs/ Directory im Projektverzeichnis
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/ortswehrfuehrer.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.level=INFO
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.rotation.rotate-on-boot=false

# Auch im Testprofil Datei-Logging aktivieren
%test.quarkus.log.file.enabled=true
%test.quarkus.log.file.path=logs/ortswehrfuehrer.log

# Category Logging für eigene Anwendungsklassen
quarkus.log.category."de.eichstaedt.ortswehrfuehrer".level=DEBUG
